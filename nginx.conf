# Example reverse-proxy config. Replace library.example.com with your domain
# and point the certificate paths at your own TLS certificates.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Nginx-level rate limiting (kernel shared memory — survives restarts) ──
    # These zones complement the in-process Node.js rate limits and act as a
    # first line of defence before requests reach the application at all.
    #
    # Auth endpoints  : 10 req/min/IP  (login, register, recover-vault, …)
    # Upload endpoint : 20 req/min/IP
    # General API     : 120 req/min/IP
    # Static/pages    : 300 req/min/IP (generous; browsers pipeline many reqs)
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

    # Return 429 (not 503) on rate limit breach so clients handle it correctly
    limit_req_status 429;

    # HTTP Server - Redirect to HTTPS
    server {
        listen 8080;
        server_name library.example.com localhost;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - Reverse Proxy
    server {
        listen 8443 ssl;
        server_name library.example.com localhost;

        ssl_certificate /etc/letsencrypt/live/library.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/library.example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 100M;

        # Security Headers (Redundant protection alongside Next.js config)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob:; font-src 'self' data:; frame-src 'self'; worker-src 'self' blob:;" always;

        # ── Auth endpoints: strict limit, small burst ─────────────────────────
        location ~ ^/api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Upload + backup: moderate limit ──────────────────────────────────
        location ~ ^/api/(upload|backup) {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Pages and static assets ───────────────────────────────────────────
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
